<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Título do Post - Eu vi na EBD</title>
    <!-- O ../ faz o arquivo buscar o CSS na pasta raiz -->
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <!-- CABEÇALHO (Links ajustados com ../) -->
    <header class="navbar-header">
        <div class="header-container">
            <a href="../index.html" class="brand-logo">
                <span class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        <path d="M12 6v10"></path>
                    </svg>
                </span>
                <span class="logo-text">Eu vi na <strong class="highlight">EBD</strong></span>
            </a>

            <button class="hamburger-btn" id="hamburgerBtn" aria-label="Abrir Menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <nav class="nav-menu" id="navMenu">
                <ul class="nav-list">
                    <li><a href="../index.html" class="nav-link">Início</a></li>
                    <li><a href="../estudos.html" class="nav-link">Estudos</a></li>
                    <li><a href="../reflexoes.html" class="nav-link">Reflexões</a></li>
                    <li><a href="../sobre.html" class="nav-link">Sobre</a></li>
                </ul>

                <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Alternar Tema">
                    <span class="theme-icon sun-icon">☀️</span>
                    <span class="theme-icon moon-icon">🌙</span>
                    <span class="theme-text">Tema</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- CONTEÚDO DO POST -->
    <main class="main-wrapper">
        <div class="content-container">
            <div class="main-content">
                <article class="single-post-article">
                    <h1 class="single-post-title">Título do Seu Artigo Aqui</h1>
                    <div class="single-post-body">
                        <p>Escreva o conteúdo do seu artigo aqui...</p>
                    </div>
                </article>
            </div>
        </div>
    </main>

    <!-- RODAPÉ (Links ajustados com ../) -->
    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-links">
                <a href="../index.html">Início</a>
                <a href="../estudos.html">Estudos</a>
                <a href="../reflexoes.html">Reflexões</a>
                <a href="../sobre.html">Sobre</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Eu vi na EBD. Criado por <strong>Tiago Correia</strong> — Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- SCRIPT DE TEMA E MENU MOBILE -->
    <script>
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const navMenu = document.getElementById('navMenu');
        hamburgerBtn.addEventListener('click', () => {
            hamburgerBtn.classList.toggle('active');
            navMenu.classList.toggle('active');
        });

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const htmlElement = document.documentElement;
        const savedTheme = localStorage.getItem('theme') || 'light';
        htmlElement.setAttribute('data-theme', savedTheme);

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    </script>
</body>
</html>
